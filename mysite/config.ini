[database]
database = postgres
host = localhost
user = postgres
password = postgres
port = 5432
schema = public
dbname = tpch

[support]
pkfk = pkfkrelations.csv

[logging]
level = DEBUG

[feature]
union = yes
nep = yes
cs2 = no
or = yes
outer_join = yes
backup_method = native

[options]
scale_down = no
scale_factor = 1
scale_retry = 1

