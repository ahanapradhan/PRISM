inputs:
  - tests-examples/prism-pilots/DS1/tables/part.csv
output: tests-examples/prism-pilots/DS1/expected.csv
columns:
  - p_container
constants:
  - 'SM CASE'
loc: 1
sql: |
  SELECT p_partkey, p_name, p_comment
  FROM part
  WHERE p_container IN ('SM CASE');
comment: |
  df1 <- df_part %>% filter(p_container == 'SM CASE')
  out <- df1 %>% select(p_partkey, p_name, p_comment) %>% arrange(p_partkey)
