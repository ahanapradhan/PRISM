inputs:
  - tests-examples/prism-pilots/DS3/tables/part.csv
output: tests-examples/prism-pilots/DS3/expected.csv
columns:
  - p_container
constants:
  - 'SM CASE'
  - 'SM BOX'
  - 'SM PACK'
loc: 1
sql: |
  SELECT p_partkey, p_name, p_comment
  FROM part
  WHERE p_container IN ('SM CASE', 'SM BOX', 'SM PACK');
comment: |
  df1 <- df_part %>% filter(p_container %in% c('SM CASE', 'SM BOX', 'SM PACK'))
  out <- df1 %>% select(p_partkey, p_name, p_comment) %>% arrange(p_partkey)
