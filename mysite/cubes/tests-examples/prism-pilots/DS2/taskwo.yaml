inputs:
  - tests-examples/prism-pilots/DS2/tables/part.csv
output: tests-examples/prism-pilots/DS2/expected.csv
loc: 1
sql: |
  SELECT p_partkey, p_name, p_comment
  FROM part
  WHERE p_container IN ('SM CASE', 'SM BOX');
comment: |
  df1 <- df_part %>% filter(p_container %in% c('SM CASE', 'SM BOX'))
  out <- df1 %>% select(p_partkey, p_name, p_comment) %>% arrange(p_partkey)
